import me.modmuss50.mpp.ReleaseType

plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

subprojects {
    apply plugin: 'java'

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)
    java.withSourcesJar()

    jar {
        from(rootProject.file("LICENSE"))
        from(rootProject.file("README.md"))
        manifest {
            attributes([
                    'Specification-Title'     : mod_name,
                    'Specification-Vendor'    : mod_author,
                    'Specification-Version'   : project.jar.archiveVersion,
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : project.jar.archiveVersion,
                    'Implementation-Vendor'   : mod_author,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    'Timestampe'              : System.currentTimeMillis(),
                    'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                    'Build-On-Minecraft'      : minecraft_version
            ])
        }
    }

    sourcesJar {
        from(rootProject.file("LICENSE"))
        from(rootProject.file("README.md"))
    }

    repositories {
        // Picks up an AssortedLib built locally with
        //   cd ../AssortedLib && ./gradlew publishToMavenLocal
        // which is how you test an unreleased change to it. Remote AssortedMods below is the
        // source for every published version, and the only one CI uses.
        mavenLocal()

        mavenCentral()

        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }

        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        
            content {
                excludeGroupByRegex "net\\.minecraft.*"
                excludeGroupByRegex "net\\.fabricmc.*"
                excludeGroupByRegex "net\\.neoforged.*"
            }
       }

        maven {
            name = 'BlameJared Maven (CrT / Bookshelf)'
            url = 'https://maven.blamejared.com'
        
            content {
                excludeGroupByRegex "net\\.minecraft.*"
                excludeGroupByRegex "net\\.fabricmc.*"
                excludeGroupByRegex "net\\.neoforged.*"
            }
       }

        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        
            content {
                excludeGroupByRegex "net\\.minecraft.*"
                excludeGroupByRegex "net\\.fabricmc.*"
                excludeGroupByRegex "net\\.neoforged.*"
            }
       }

        maven {
            name = "AssortedMods"
            url = "https://maven.grimoid.com/mods"
        
            content {
                excludeGroupByRegex "net\\.minecraft.*"
                excludeGroupByRegex "net\\.fabricmc.*"
                excludeGroupByRegex "net\\.neoforged.*"
            }
       }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 25
        // The 26.2 port produces far more than javac's default 100-error cap.
        it.options.compilerArgs << '-Xmaxerrs' << '10000'
        // Policy: no deprecated APIs. Surface them by name rather than as a summary note.
        it.options.compilerArgs << '-Xlint:deprecation'
    }

    // No javadoc jar is published - the sources jar already gives consumers IDE docs at a
    // twentieth of the size. This only shapes a manual `gradlew javadoc`, which trips
    // doclint constantly on Minecraft-derived sources.
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
        failOnError = false
    }

    // Disables Gradle's custom module metadata from being published to maven. The
    // metadata includes mapped dependencies which are not reasonably consumable by
    // other mod developers.
    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }
}

/**
 * The release notes, in order of preference: -Pchangelog=..., the top section of CHANGELOG.md (from
 * its first "## " heading to the next one), then a one-line default. Never generated from the git
 * log: a changelog nobody wrote reads worse than a bare version line.
 */
def releaseChangelog = {
    String provided = findProperty('changelog')
    if (provided) {
        return provided
    }

    File notes = rootProject.file('CHANGELOG.md')
    if (notes.exists()) {
        List<String> lines = notes.readLines()
        int start = lines.findIndexOf { it.startsWith('## ') }
        if (start >= 0) {
            int end = lines.findIndexOf(start + 1) { it.startsWith('## ') }
            return lines.subList(start, end < 0 ? lines.size() : end).join('\n').trim()
        }
    }

    return "$mod_name $version for Minecraft $minecraft_version."
}()

// Publishes the built jars to Modrinth and CurseForge, one destination per loader. Run it by hand
// with `./gradlew publishMods`, or through the Build workflow's `release` input.
//
// Both tokens come from the environment. Without them - or with -PdryRun=true - the plugin writes
// what it would have uploaded into build/publishMods rather than uploading it, so a run on a
// machine with no credentials rehearses instead of failing. A destination whose id is blank in
// gradle.properties is left out entirely, which the release job checks for before it starts.
//
// A Modrinth version number is unique within a project, so the two loaders cannot both be plain
// `$version`; they go up as `$version+fabric` and `$version+neoforge`. CurseForge numbers nothing
// and takes both files, told apart by their display names.
//
// Guarded on the loader modules existing because -PcommonOnly leaves them out of the build.
if (findProject(':fabric') != null && findProject(':neoforge') != null) {
    publishMods {
        changelog = releaseChangelog
        // Both platforms call the stable channel "release"; the plugin calls it STABLE.
        String channel = (findProperty('releaseType') ?: release_type) as String
        type = ReleaseType.of(channel.equalsIgnoreCase('release') ? 'stable' : channel)
        dryRun = Boolean.parseBoolean((findProperty('dryRun') ?: 'false') as String) ||
                (System.getenv('MODRINTH_TOKEN') == null && System.getenv('CURSEFORGE_TOKEN') == null)

        if (modrinth_id) {
            def modrinthShared = modrinthOptions {
                accessToken = providers.environmentVariable('MODRINTH_TOKEN')
                projectId = modrinth_id
                minecraftVersions.add(minecraft_version)
            }

            modrinth('modrinthFabric') {
                from modrinthShared
                file project(':fabric')
                version = "${project.version}+fabric"
                displayName = "$mod_name ${project.version} (Fabric)"
                modLoaders.add('fabric')
                requires('fabric-api')
                requires(assortedlib_slug)
            }

            modrinth('modrinthNeoForge') {
                from modrinthShared
                file project(':neoforge')
                version = "${project.version}+neoforge"
                displayName = "$mod_name ${project.version} (NeoForge)"
                modLoaders.add('neoforge')
                requires(assortedlib_slug)
            }
        }

        if (curseforge_id) {
            def curseforgeShared = curseforgeOptions {
                accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
                projectId = curseforge_id
                projectSlug = curseforge_slug
                minecraftVersions.add(minecraft_version)
                client = true
                server = true
            }

            curseforge('curseforgeFabric') {
                from curseforgeShared
                file project(':fabric')
                displayName = "$mod_name ${project.version} (Fabric)"
                modLoaders.add('fabric')
                requires('fabric-api')
                requires(assortedlib_slug)
            }

            curseforge('curseforgeNeoForge') {
                from curseforgeShared
                file project(':neoforge')
                displayName = "$mod_name ${project.version} (NeoForge)"
                modLoaders.add('neoforge')
                requires(assortedlib_slug)
            }
        }
    }
}
