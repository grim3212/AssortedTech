plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'maven-publish'
}

base.archivesName = "${mod_id}-common-${minecraft_version}"

// ModDevGradle "vanilla mode": compiles against plain, deobfuscated Minecraft with no
// loader attached. This replaces SpongePowered VanillaGradle, which is no longer maintained.
neoForge {
    neoFormVersion = project.neoform_version

    runs {
        if (project.hasProperty('common_runs_enabled') ? project.findProperty('common_runs_enabled').toBoolean() : true) {
            client {
                client()
                gameDirectory = project.file('run')
            }
            server {
                server()
                gameDirectory = project.file('run')
            }
        }
    }
}

dependencies {
    compileOnly group: "org.spongepowered", name: "mixin", version: project.mixin_version
    compileOnly group: "com.grim3212.assorted.lib", name: "assortedlib-common-${minecraft_version}", version: assortedlib_version
}

processResources {
    filesMatching("pack.mcmeta") {
        expand 'mod_name': project.mod_name
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.base.archivesName.get()
            version project.version
            from components.java
        }
    }

    repositories {
        // Only declare the shared maven when local_maven is actually set; otherwise this
        // resolved to the literal "file://null" and broke publishing.
        if (System.getenv("local_maven") != null) {
            maven {
                url "file://" + System.getenv("local_maven")
            }
        }
    }
}
