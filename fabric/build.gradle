plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'idea'
}

base.archivesName = "${mod_id}-fabric-${minecraft_version}"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No `mappings` declaration: as of 26.x Fabric has dropped intermediary (the meta API
    // reports intermediary 0.0.0) and Loom uses official Mojang names directly, so there is
    // no remapping step to configure. Parchment has published nothing for 26.x either.

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Loom 1.17 dropped modImplementation along with remapping: 26.x has no intermediary, so mod
    // dependencies are ordinary dependencies now.
    implementation "com.grim3212.assorted.lib:assortedlib-fabric-${minecraft_version}:${assortedlib_version}"

    implementation project(":common")
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
        datagenClient {
            inherit client
            name "Fabric Datagen"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources/")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            runDir "build/datagen"
        }
    }
}

sourceSets {
    main.resources.srcDirs += ['src/generated/resources', '../common/src/generated/client', '../common/src/generated/server']
}

// Fabric consumes both its own generated tree and the shared one NeoForge writes into common, and
// the two overlap on the shared c: tags (verified byte-identical). Allow the duplicate rather than
// dropping a root - dropping the common root is what left every block with a missing model.
tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

processResources {
    from project(":common").sourceSets.main.resources
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand 'version': project.version, 'fabric_mc_version_range': project.fabric_mc_version_range, 'license': project.license,
                'mod_id': project.mod_id, 'mod_author': project.mod_author, 'mod_description': project.mod_description,
                'mod_name': project.mod_name, 'issue_tracker': project.issue_tracker,
                'assortedlib_version': project.assortedlib_version
    }

    filesMatching("pack.mcmeta") {
        expand 'mod_name': project.mod_name
    }

    // Exclude datagenerator .cache directory
    exclude '.cache'
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.base.archivesName.get()
            version project.version
            from components.java
        }
    }

    repositories {
        // Only declare the shared maven when local_maven is actually set; otherwise this
        // resolved to the literal "file://null" and broke publishing.
        if (System.getenv("local_maven") != null) {
            maven {
                url "file://" + System.getenv("local_maven")
            }
        }
    }
}
