plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'idea'
}

base.archivesName = "${mod_id}-fabric-${minecraft_version}"

// Gametests, in their own source set so they are never packaged. It mirrors main: common's
// gametest sources are compiled inline here, and common's gametest resources - the test_instance
// jsons and the test_box structure, which both loaders share - are copied in alongside.
// Declared before the loader block below, which references it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No `mappings` declaration: as of 26.x Fabric has dropped intermediary (the meta API
    // reports intermediary 0.0.0) and Loom uses official Mojang names directly, so there is
    // no remapping step to configure. Parchment has published nothing for 26.x either.

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Loom 1.17 dropped modImplementation along with remapping: 26.x has no intermediary, so mod
    // dependencies are ordinary dependencies now.
    implementation "com.grim3212.assorted.lib:assortedlib-fabric-${minecraft_version}:${assortedlib_version}"

    implementation project(":common")
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        // A second, development-only mod. Fabric has no equivalent of FML's @EventBusSubscriber,
        // so the only way to register the test functions without `main` referencing the gametest
        // source set - which would drag the tests into the shipped jar - is to give that source set
        // its own fabric.mod.json and let it load as its own mod. Not an input to `jar`.
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
        // Headless gametest run. Fabric API's gametest module swaps the server main class out
        // when this property is set, runs every test_instance and exits non-zero on failure.
        gameTest {
            inherit server
            name "Fabric Game Test"
            ideConfigGenerated(true)
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${file("build/gametest/report.xml")}"
            runDir "build/gametest"
        }
        datagenClient {
            inherit client
            name "Fabric Datagen"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources/")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            runDir "build/datagen"
        }
    }
}

sourceSets {
    main.resources.srcDirs += ['src/generated/resources', '../common/src/generated/client', '../common/src/generated/server']
}

// Fabric consumes its own generated tree and the shared one NeoForge writes into common - the only
// source of client models, so that root cannot be dropped. The two overlap on every recipe,
// advancement, loot table and tag both datagens write, and recipes and advancements differ: each
// carries its own loader's load conditions. Fabric's tree is listed first and duplicates are
// excluded, so Fabric's copy wins. INCLUDE let the NeoForge copy overwrite it, and Fabric then
// loaded every conditional recipe unconditionally.
tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    from project(":common").sourceSets.main.resources
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand 'version': project.version, 'fabric_mc_version_range': project.fabric_mc_version_range, 'license': project.license,
                'mod_id': project.mod_id, 'mod_author': project.mod_author, 'mod_description': project.mod_description,
                'mod_name': project.mod_name, 'issue_tracker': project.issue_tracker,
                'assortedlib_version': project.assortedlib_version
    }

    filesMatching("pack.mcmeta") {
        expand 'mod_name': project.mod_name
    }

    // Exclude datagenerator .cache directory
    exclude '.cache'
}

// Only the main compile takes common's sources. configureEach fed them to compileTestJava too,
// which has no Minecraft on its classpath, and that is what made `./gradlew build` fail.
tasks.named('compileJava') {
    source(project(":common").sourceSets.main.allSource)
}

tasks.named('compileGametestJava') {
    source(project(":common").sourceSets.gametest.allSource)
}

tasks.named('processGametestResources') {
    from project(":common").sourceSets.gametest.resources

    filesMatching("fabric.mod.json") {
        expand 'version': project.version, 'mod_id': project.mod_id, 'mod_name': project.mod_name,
                'mod_author': project.mod_author, 'license': project.license
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.base.archivesName.get()
            version project.version
            from components.java
        }
    }

    repositories {
        // Only declare the shared maven when local_maven is actually set; otherwise this
        // resolved to the literal "file://null" and broke publishing.
        if (System.getenv("local_maven") != null) {
            maven {
                url "file://" + System.getenv("local_maven")
            }
        }
    }
}
